name: secret-scan

# Runs the repository's own deterministic scanner. No cloud service, no
# credentials of its own, no network: the check that guards secrets must not
# itself depend on a third party being reachable.
on:
  push:
  pull_request:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Scan tracked files for credential material
        run: python tools/secret_scan.py
      - name: Verify tracked snapshots are already sanitized
        run: |
          python - <<'PY'
          import subprocess, sys
          sys.path.insert(0, "tools")
          from sanitize_ha_snapshot import sanitize_document
          import json
          paths = subprocess.run(["git", "ls-files"], capture_output=True, text=True).stdout.split()
          dirty = []
          for p in paths:
              if "config_entries" not in p:
                  continue
              try:
                  doc = json.load(open(p))
              except Exception:
                  continue
              _out, stats = sanitize_document(doc)
              if stats.get("key_name", 0) or stats.get("value_shape", 0):
                  dirty.append(p)
          if dirty:
              print("config-entry snapshots still contain credential material:")
              for p in dirty:
                  print("  ", p)
              raise SystemExit(1)
          print("all tracked config-entry snapshots are sanitized")
          PY
